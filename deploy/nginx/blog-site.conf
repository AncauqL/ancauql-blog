# 反向代理 + HTTPS 示例（放到 /etc/nginx/conf.d/blog-site.conf）
# 同域部署：前端静态资源 + /api 反代后端，避免跨域（此时后端 CORS 可留空）
# 记得把 server_name 和证书路径换成你自己的。

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # certbot 会自动补上 80 -> 443 跳转；手动配置时可用：
    # return 301 https://$host$request_uri;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 12m;   # 与后端上传上限匹配

    # 前端静态产物（history 路由 fallback）
    root /var/www/ancauql-blog/dist;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 登录接口限流（配合 00-blog-limit.conf 里的 limit_req_zone）
    location = /api/auth/login {
        limit_req zone=blog_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:9999/auth/login;
        include /etc/nginx/conf.d/blog-proxy-common.inc;
    }
    location = /api/auth/register {
        limit_req zone=blog_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:9999/auth/register;
        include /etc/nginx/conf.d/blog-proxy-common.inc;
    }

    # 其余接口：/api/xxx -> 后端 /xxx
    location /api/ {
        proxy_pass http://127.0.0.1:9999/;
        include /etc/nginx/conf.d/blog-proxy-common.inc;
    }

    # 上传图片、RSS 订阅源、站点地图与 robots（后端直接提供）
    location /uploads/ {
        proxy_pass http://127.0.0.1:9999/uploads/;
        include /etc/nginx/conf.d/blog-proxy-common.inc;
    }
    location = /feed.xml {
        proxy_pass http://127.0.0.1:9999/feed.xml;
        include /etc/nginx/conf.d/blog-proxy-common.inc;
    }
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:9999/sitemap.xml;
        include /etc/nginx/conf.d/blog-proxy-common.inc;
    }
    location = /robots.txt {
        proxy_pass http://127.0.0.1:9999/robots.txt;
        include /etc/nginx/conf.d/blog-proxy-common.inc;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }
}
